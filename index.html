<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Imagens e videos</title>
</head>
<body>
	<main>
		<img src="./1.png" width="400px" height="300px" alt="numero 1"/>
		<img src="./2.png" width="400px" height="300px" alt="numero 2"/>
		<img src="./3.png" width="400px" height="300px" alt="numero 3" />
		<br/>
		<br/>
		<img src="./4.png" width="400px" height="300px" alt="numero 4"/>
		<img src="./5.png" width="400px" height="300px" alt="numero 5"/>
		<img src="./6.png" width="400px" height="300px" alt="numero 6"/>
		<figure>
		  <img src="7.png" alt="numero 1 vezes">
		  <figcaption>Uma vez</figcaption>
		</figure>
		<figure>
		  <img src="8.png" alt="numero 2  vezes">
		  <figcaption>Duas vezes</figcaption>
		</figure>
		<figure>
		  <img src="9.png" alt="numero 3  vezes">
		  <figcaption>Três vezes.</figcaption>
		</figure>
	</main>
	<footer>
		
		<video controls poster="./coelho.png" width="640" height="360">
		  <source src="./coelho.mp4" type="video/mp4">
		  Seu navegador não suporta a tag de vídeo HTML5.
		</video>
    <body>
</html>
